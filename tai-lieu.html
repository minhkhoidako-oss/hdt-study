    function normalize(v=''){return String(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').trim()}
    function parseCsv(text){const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(q&&n==='"'){cell+='"';i++;}else q=!q}else if(c===','&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&n==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else cell+=c}if(cell!==''||row.length){row.push(cell);if(row.some(x=>x.trim()!==''))rows.push(row)}if(!rows.length)return[];const h=rows[0].map(x=>x.trim().toLowerCase());return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]||'').trim()]))) }

    function mapRow(r,i){const subject=(r.subject||'Khác').trim();const title=(r.title||'').trim();const file=r.fileUrl||r.fileurl||r.url||'';return{id:r.id||`sheet-${i+1}`,title,grade:r.grade||'12',subject,type:r.type||r.category||'Tài liệu',desc:r.desc||r.description||'',file,fileSize:r.fileSize||r.filesize||'PDF',slug:r.slug||slug(title),hot:truthy(r.hot),featured:truthy(r.featured),publishedAt:r.publishedAt||r.publishedat||''}}

        root.innerHTML=`<div class="detail-grid"><article class="detail-main"><span class="detail-kicker"><span style="width:7px;height:7px;border-radius:50%;background:${accent};display:inline-block"></span> ${esc(r.subject)} · ${esc(r.type)}</span><h1>${esc(r.title)}</h1><p class="detail-desc">${esc(r.desc||`Tài liệu ${r.subject} lớp ${r.grade}, dạng ${r.type}, được HDT Study tổng hợp để hỗ trợ ôn tập.`)}</p><div class="detail-meta"><span>Lớp ${esc(r.grade)}</span><span>${esc(r.subject)}</span><span>${esc(r.type)}</span>${r.hot?'<span>HOT</span>':''}<span>MIỄN PHÍ</span></div><div class="detail-actions"><a class="primary-btn" href="${has?esc(view):'#'}" target="_blank" rel="noopener noreferrer" ${has?'':'aria-disabled="true"'}>${has?'Xem PDF':'Chưa có PDF'}</a><a class="secondary-btn" href="${has?esc(dl):'#'}" target="_blank" rel="noopener noreferrer" ${has?'':'aria-disabled="true"'}>Tải PDF</a><button class="zalo-btn" id="shareBtn" type="button">Chia sẻ tài liệu</button><a class="zalo-btn" href="https://zalo.me/0976366683" target="_blank" rel="noopener noreferrer">Liên hệ Zalo HDT</a></div><div class="detail-info-grid"><div class="detail-info"><small>Định dạng</small><strong>PDF</strong></div><div class="detail-info"><small>Dung lượng</small><strong>${esc(r.fileSize||'PDF')}</strong></div><div class="detail-info"><small>Trạng thái</small><strong>${has?'Sẵn sàng tải':'Đang cập nhật'}</strong></div></div><section class="seo-block"><h2>${esc(r.title)} là tài liệu gì?</h2><p>${esc(seoParagraph)}</p><h3>Thông tin nhanh</h3><ul><li><strong>Môn:</strong> ${esc(r.subject)}</li><li><strong>Khối:</strong> lớp ${esc(r.grade)}</li><li><strong>Dạng:</strong> ${esc(r.type)}</li><li><strong>Truy cập:</strong> miễn phí trên HDT Study</li></ul><div class="keyword-row">${keywords}</div></section><section class="seo-block"><h2>Tài liệu liên quan</h2><p>Khám phá thêm các tài liệu cùng môn hoặc cùng khối để học theo một mạch chủ đề thuận tiện hơn.</p><div class="related-grid">${relatedHtml}</div></section><section class="detail-section"><h2>Về tài liệu này</h2><p>${esc(r.desc||seoParagraph)}</p></section><section class="detail-section"><h2>Gợi ý sử dụng</h2><p>HDT Study khuyến khích bạn đọc phần kiến thức cần ôn, đánh dấu các nội dung chưa chắc và kết hợp luyện tập theo từng chuyên đề. Với tài liệu có liên kết PDF, bạn có thể xem trực tiếp hoặc tải về để học offline.</p></section><div class="detail-footer"><div><strong>HDT Study · Kho tài liệu ôn thi</strong><span>Tìm đúng tài liệu, học gọn hơn.</span></div><a href="index.html#tai-lieu">← Về kho tài liệu</a></div></article><aside class="detail-side"><div class="detail-preview" style="background:linear-gradient(135deg,${soft},#fff)"><div class="detail-preview-icon" style="color:${accent}">${icon}</div><small>${esc(r.subject)}</small></div><div class="detail-tip"><strong>Link tải tài liệu:</strong><br>${has?'Đang kết nối với file PDF của HDT. Bạn có thể xem hoặc tải ngay.':'Tài liệu chưa có link PDF công khai. Vui lòng quay lại sau.'}</div><div class="detail-status ${has?'ok':''}">${has?'● Tài liệu sẵn sàng':'● Đang cập nhật file'}</div></aside></div>`;
        document.getElementById('shareBtn').addEventListener('click',async()=>{const url=location.href;try{await navigator.clipboard.writeText(url);const b=document.getElementById('shareBtn');const old=b.textContent;b.textContent='Đã sao chép link';setTimeout(()=>b.textContent=old,1500)}catch{window.prompt('Sao chép link tài liệu:',url)}});
      }catch(e){console.error(e);root.innerHTML='<div class="detail-main"><h1>Không thể tải tài liệu</h1><p class="detail-desc">Google Sheets chưa phản hồi. Hãy kiểm tra kết nối hoặc quay lại trang chủ.</p><a class="primary-btn" href="index.html#tai-lieu">Quay lại HDT Study</a></div>'}
    }
    init();
  </script>
